<h1>cipher ライブラリ関数</h1>

<dl>
<dt>
	reads(<it>filename</it>) </dt><dd>
		ファイルの中身を単一の文字列として読む。</dd>
<dt>
	write(<it>filename</it>, <it>string</it>) </dt><dd>
		文字列をファイルに書き出す。</dd>

<dt>
	rand(<it>length</it>) </dt><dd>
		0から１の乱数からなる長さlengthの配列を返す。とりあえず１５ビット精度。</dd>
</dl>
